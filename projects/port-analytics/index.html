<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Analytics — yoerivda.be</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="viz.css">
  <style>
    /* ── This page: hero centered, viz full-width ── */
    main {
      max-width: 100%;
      padding: 0;
    }
    #hero {
      max-width: 900px;
      margin: 0 auto;
      padding: 7rem 1.5rem 4rem;
    }
    #viz {
      padding: 0;
      border-top: 1px solid var(--border);
    }

    /* ── Tab nav — page-level navigation, visually distinct from in-viz filters ── */
    .tab-nav {
      background: var(--bg);
      border-bottom: 2px solid var(--border);
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.45rem 1.1rem;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
    }

    /* ── Tab panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Loading placeholder */
    .tab-loading {
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="site-name" href="/">yoerivda.be</a>
      <ul>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h1>Port Analytics</h1>
      <p class="tagline">Interactive maps and dashboards built on maritime vessel data.</p>
      <p class="tags" style="margin-top:1rem;">
        <span class="tag">D3.js</span>
        <span class="tag">Leaflet</span>
        <span class="tag">AIS data</span>
      </p>
    </section>

    <section id="viz">
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="port">Port Dashboard</button>
        <button class="tab-btn" data-tab="aarhus">Aarhus Dashboard</button>
        <button class="tab-btn" data-tab="map">Danish Waters Map</button>
        <button class="tab-btn" data-tab="aarhus-map">Aarhus Zone Map</button>
      </div>

      <div class="tab-panel active" id="tab-port">
        <div id="chart-port"><div class="tab-loading">Loading&hellip;</div></div>
      </div>

      <div class="tab-panel" id="tab-aarhus">
        <div id="chart-aarhus"><div class="tab-loading">Loading&hellip;</div></div>
      </div>

      <div class="tab-panel" id="tab-map">
        <div id="chart-map" style="height:600px;"><div class="tab-loading">Loading&hellip;</div></div>
      </div>

      <div class="tab-panel" id="tab-aarhus-map">
        <div id="chart-aarhus-map" style="height:600px;"><div class="tab-loading">Loading&hellip;</div></div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Yoeri Van den Abbeele</p>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const TAB_SCRIPTS = {
      'port':       { data: 'data/dashboard.js',              module: 'port-dashboard.js' },
      'aarhus':     { data: 'data/aarhus_analytics.js',       module: 'aarhus-dashboard.js' },
      'map':        { data: 'data/vessels_2026-02-01.js',     module: 'map.js' },
      'aarhus-map': { data: 'data/aarhus_vessels_feb2026.js', module: 'aarhus-map.js' },
    };
    const loaded = new Set();

    function loadTab(tabId) {
      if (loaded.has(tabId)) return;
      loaded.add(tabId);
      const { data, module } = TAB_SCRIPTS[tabId];
      const s1 = document.createElement('script');
      s1.src = data;
      s1.onload = () => {
        const s2 = document.createElement('script');
        s2.src = module;
        document.body.appendChild(s2);
      };
      document.body.appendChild(s1);
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabId = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        loadTab(tabId);
      });
    });

    loadTab('port');
  </script>
</body>
</html>
